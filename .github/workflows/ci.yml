name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: [22, 24, 26], nest: [11, 12] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - if: matrix.nest == 11
        run: npm install --no-save @nestjs/common@11 @nestjs/core@11 @nestjs/testing@11
      - if: ${{ !(matrix.node == 24 && matrix.nest == 12) }}
        run: npm test
      - if: ${{ matrix.node == 24 && matrix.nest == 12 }}
        run: npm run test:cov
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { ioredis: [5, 6] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm install --no-save ioredis@${{ matrix.ioredis }}
      - run: npm run test:integration
  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:consumers
